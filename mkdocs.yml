site_name: EtcFS
site_description: A Raft/etcd-coordinated cluster filesystem over shared raw block storage
repo_url: https://github.com/MHS-20/EtcFS
repo_name: MHS-20/EtcFS
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - FUSE Daemon Architecture: architecture/fuse-architecture.md
      - FUSE Request Dispatch: architecture/fuse-request-dispatch.md
      - FUSE Read Operations: architecture/fuse-read-operations.md
      - FUSE Write Operations: architecture/fuse-write-operations.md
      - FUSE Cache Management: architecture/fuse-cache-management.md
      - Metadata Schema: architecture/metadata-schema.md
      - Metadata Store: architecture/metadata-store.md
      - Namespace Operations: architecture/namespace-operations.md
      - POSIX Lock Operations: architecture/posix-lock-operations.md
      - Concurrency Control: architecture/concurrency-control.md
      - Block Device I/O Substrate: architecture/block-device-io.md
      - Arena Allocator: architecture/arena-allocator.md
      - Arena Compaction: architecture/arena-compaction.md
      - Write-Ahead Log: architecture/write-ahead-log.md
      - Write Ordering Invariants: architecture/write-ordering-invariants.md
      - Cache Coherence and Data Consistency: architecture/cache-coherence.md
      - Multi-Node Cache Coherence: architecture/multi-node-coherence.md
      - Self-Fencing Watchdog: architecture/self-fencing-watchdog.md
      - External Fencing Controller: architecture/external-fencing-controller.md
      - Fencing Generation Protocol: architecture/fencing-generation-protocol.md
      - Continuous Scrubber: architecture/continuous-scrubber.md
      - Crash Recovery and Deterministic Replay: architecture/crash-recovery-determinism.md
      - Deterministic Fault-Injection Simulator: architecture/deterministic-simulator.md
      - Invariant Checkers: architecture/invariant-checkers.md
      - Elastic Join and Leave: architecture/elastic-join-leave.md
      - Single-Node Integration: architecture/single-node-integration.md
      - "MockStore: In-Memory etcd Simulation": architecture/mock-store.md
  - Chaos Reports:
      - Fresh Cluster Per Scenario (2026-07-30): chaos-reports/2026-07-30-fresh-cluster-per-scenario.md
      - Single-Cluster and Fuzz (2026-07-31): chaos-reports/2026-07-31-single-cluster-and-fuzz.md
      - Elastic Scale-Out/In (2026-07-31): chaos-reports/2026-07-31-elastic-scale-out-in.md
  - Research:
      - etcd/Raft Internals: etcd_raft_research.md
      - Cluster Filesystem Survey: research/cluster-fs-survey.md
      - VFS/FUSE/Block Research: research/vfs_fuse_block_research.md
      - Userspace Filesystem Research: research/userspace_filesystem_research.md
